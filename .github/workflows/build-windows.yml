name: Build Windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'cursor/**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
        env:
          # Optional. Baked in as the default Client ID; empty falls back to the public one.
          # A Developer Client ID saved in Settings → Advanced overrides it.
          VITE_TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: vesper-desk-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vesper-desk-windows
          path: release
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Vesper Desk ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'pre') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
          body: |
            Unsigned Windows build of Vesper Desk for testing. Do not expect a signed SmartScreen reputation yet.

            **Install:** `Vesper-Desk-Setup-*.exe` (one-click NSIS) or run `Vesper-Desk-Portable-*.exe`.
            Open the app — no setup wizard. Use **Login to Twitch** from the ☰ menu. The Twitch Client ID is built in; to use your own, put it in Settings → Advanced, then **Save**. OAuth redirect: `http://localhost:5173/oauth/callback`.

            Settings persist only after **Save**. Quit with **Ctrl+Q** or the window Close control.

            SmartScreen may warn on unsigned downloads — More info → Run anyway. Portable builds are standalone EXEs.
